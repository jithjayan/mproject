<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.username }}'s Profile</title>
    {% load static %}
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/style.css'%}">
    <style>
        /* Global Reset */
        body, h2, h3, p, img {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body and Container Styling */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f3f4f6;
            color: #444;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        /* User Info Section */
        .user-info {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .user-info h2 {
            font-size: 2.5rem;
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .user-info img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            border: 4px solid #f4f4f4;
            margin-bottom: 15px;
            transition: transform 0.3s ease-in-out;
        }

        .user-info img:hover {
            transform: scale(1.05);
        }

        .user-info p {
            font-size: 1.1rem;
            color: #666;
            font-weight: 300;
        }

        .user-info strong {
            font-size: 1.4rem;
            color: #333;
            font-weight: 500;
        }

        .user-info em {
            font-size: 1rem;
            color: #999;
            font-style: italic;
        }

        /* Uploaded Images Section */
        .uploaded-images h3 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        /* Image Grid Container */
        .image-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .image-item {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .image-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-item p {
            padding: 10px;
            text-align: center;
            background-color: #f9f9f9;
            font-weight: 500;
            color: #444;
        }

        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
        }

        .image-item:hover img {
            transform: scale(1.05);
        }

        .empty {
            text-align: center;
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 20px;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .image-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 90%;
                padding: 20px;
            }

            .user-info img {
                width: 120px;
                height: 120px;
            }

            .user-info h2 {
                font-size: 2rem;
            }

            .user-info p {
                font-size: 1rem;
            }

            .image-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .uploaded-images h3 {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                width: 95%;
                padding: 15px;
            }

            .user-info img {
                width: 100px;
                height: 100px;
            }

            .user-info h2 {
                font-size: 1.6rem;
            }

            .user-info p {
                font-size: 0.9rem;
            }

            .image-container {
                grid-template-columns: 1fr;
            }

            .uploaded-images h3 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- User Info Section -->
        <div class="user-info">
            <h2>Profile</h2>
            <img src="{{ profile.profile_picture.url }}" alt="{{ user.username }}'s Profile Picture" class="img-thumbnail">
            <p><strong>{{ user.first_name }} {{ user.last_name }}</strong></p>
            <p><em>{{ profile.bio }}</em></p>
        </div>

        <!-- Uploaded Images Section -->
        <div class="uploaded-images">
            <h3>Uploaded Images:</h3>
            {% for image in images %}
                <a href="../viewpic/{{ image.pk }}">
                    <div class="image-item">
                        <img src="{{ image.img.url }}" alt="{{ image.title }}">
                        <p>{{ image.title }}</p>
                    </div>
                </a>
            {% empty %}
                <p class="empty">No images uploaded yet.</p>
            {% endfor %}
        </div>
    </div>

</body>

</html>
