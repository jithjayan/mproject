<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link href='https://fonts.googleapis.com/css?family=Stylish' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <link rel="stylesheet" href="{% static 'css/style.css'%}">
 <style>
    .revbtn{
        margin-top: 10px;
        display: block;
        width: 100%;
        text-align: center;
        color: rgb(12, 11, 11);
        text-decoration: none;
        border: 1px solid rgb(12, 11, 11);
        padding: 5px;
        border-radius: 5px;
        background-color: #dfcc20;
    }
    .revbtn:hover{
        background-color: #f0e6a1;
    }
 </style>
</head>
<body>

    <nav class="navbar navbar-expand-sm" id="nbr">
        <div class="container-fluid">
          <a class="navbar-brand logo" href="../home" >PICZ B</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="" style="color: #ffffff;"> </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="javascript:void(0)"></a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="javascript:void(0)"></a>
              </li>
            </ul>
            <form class="d-flex" method="GET" action="../search">
              <input class="form-control me-2" type="text" placeholder="Search" name="query">
              <button class="btn btn-dark" type="button">Search</button>
            </form>
            <div class="prfl_logo"> <a href="../login"><i class="fa-solid fa-user fa-xl" style="color: #ffffff;"></i></a></div>
          </div>
        </div>
      </nav>
      <!-- ----------------------------navend------------------ -->


      <div class="image-container">
        {% for saved in save %}
        <div class="image-item">
          <a href="../viewpic/{{saved.image.pk}}"><img src="{{ saved.image.img.url }}" alt="{{ saved.image.title }}"></a>
            <a href="./remove_saved/{{saved.image.pk}}" class="revbtn">REMOVE</a>
        </div>
        {% endfor %}
    </div>


</body>
</html>
