<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link href='https://fonts.googleapis.com/css?family=Stylish' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <link rel="stylesheet" href="{% static 'css/style.css'%}">
 <style>
    .revbtn{
        margin-top: 10px;
        display: block;
        width: 100%;
        text-align: center;
        color: rgb(12, 11, 11);
        text-decoration: none;
        border: 1px solid rgb(12, 11, 11);
        padding: 5px;
        border-radius: 5px;
        background-color: #dfcc20;
    }
    .revbtn:hover{
        background-color: #f0e6a1;
    }
    /* Image Container */
.image-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 20px;
    justify-items: center; /* Center the items */
}

/* Image Item */
.image-item {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Image Hover Effect */
.image-item:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
}

/* Image */
.image-item img {
    width: 100%;
    height: 200px;
    object-fit: cover; /* Maintain aspect ratio and cover the container */
    transition: transform 0.3s ease;
}

/* Image Hover Effect on Image */
.image-item:hover img {
    transform: scale(1.1); /* Slightly enlarge the image when hovered */
}

/* REMOVE Button */
.revbtn {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #e74c3c;
    color: #fff;
    padding: 8px 15px;
    font-size: 1rem;
    border-radius: 5px;
    text-decoration: none;
    transition: background-color 0.3s ease;
}

.revbtn:hover {
    background-color: #c0392b; /* Darker shade when hovered */
}

/* Empty Text */
p {
    text-align: center;
    color: #aaa;
    font-size: 1.2rem;
}

/* Responsive Design */
@media (max-width: 1200px) {
    .image-container {
        grid-template-columns: repeat(3, 1fr); /* 3 columns for large tablets */
    }
}

@media (max-width: 768px) {
    .image-container {
        grid-template-columns: repeat(2, 1fr); /* 2 columns for tablets */
    }
}

@media (max-width: 480px) {
    .image-container {
        grid-template-columns: 1fr; /* Single column for mobile */
    }

    .image-item img {
        height: 150px; /* Smaller image size on mobile */
    }
}

 </style>
</head>
<body>

    <nav class="navbar navbar-expand-sm" id="nbr">
        <div class="container-fluid">
          <a class="navbar-brand logo" href="../home" >PICZ B</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="" style="color: #ffffff;"> </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="javascript:void(0)"></a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="javascript:void(0)"></a>
              </li>
            </ul>
            <form class="d-flex" method="GET" action="../search">
              <input class="form-control me-2" type="text" placeholder="Search" name="query">
              <button class="btn btn-dark" type="button">Search</button>
            </form>
            <div class="prfl_logo"> <a href="../login"><i class="fa-solid fa-user fa-xl" style="color: #ffffff;"></i></a></div>
          </div>
        </div>
      </nav>
      <!-- ----------------------------navend------------------ -->

      <div class="image-container">
        {% for saved in save %}
        <div class="image-item">
            <a href="../viewpic/{{ saved.image.pk }}">
                <img src="{{ saved.image.img.url }}" alt="{{ saved.image.title }}">
            </a>
            <a href="./remove_saved/{{ saved.image.pk }}" class="revbtn">REMOVE</a>
        </div>
        {% empty %}
        <p>No images</p>
        {% endfor %}
    </div>
    
    



</body>
</html>
