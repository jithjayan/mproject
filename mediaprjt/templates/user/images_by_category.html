<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images in Category: {{ category.name }}</title>
    {% load static %}
    <link href='https://fonts.googleapis.com/css?family=Stylish' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <link rel="stylesheet" href="{% static 'css/style.css'%}">
</head>
<body>
    <nav class="navbar navbar-expand-sm" id="nbr">
        <div class="container-fluid">
          <a class="navbar-brand logo" href="../home" >PICZ B</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="" style="color: #ffffff;"> </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="javascript:void(0)"></a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="javascript:void(0)"></a>
              </li>
            </ul>
            <form class="d-flex" method="GET" action="../search">
              <input class="form-control me-2" type="text" placeholder="Search" name="query" required>
              <button class="btn btn-dark" type="submit">Search</button>
            </form>
            <div class="prfl_logo"> <a href="../login"><i class="fa-solid fa-user fa-xl" style="color: #ffffff;"></i></a></div>
          </div>
        </div>
      </nav>
      <!-- ----------------------------navend------------------ -->
    <h1>Images in Category: {{ category.name }}</h1>
    
    {% if images %}
        <div class="image-gallery">
            {% for image in images %}
            <a href="../viewpic/{{image.pk}}" target="_blank" style="text-decoration: none; color: black;">
                <div class="image-card">
                    <h3>{{ image.title }}</h3>
                    <img src="{{ image.img.url }}" alt="{{ image.title }}" style="max-width: 300px; max-height: 300px;">
                    <p>{{ image.disp }}</p>
                </div>
            </a>
            {% endfor %}
        </div>
    {% else %}
        <p>No images found in this category.</p>
    {% endif %}
</body>
</html>
